<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}bagarium{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">bagarium</a>
    <nav>
      <a href="/">Bags</a>
      <a href="/tags">Tags</a>
      <a href="/scan">Scan</a>
      <a href="/import">Import</a>
      <a href="/jobs">Jobs{% set n = active_jobs() %}{% if n %} <span class="count">{{ n }}</span>{% endif %}</a>
      <a href="/api/docs">API</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>bagarium {{ version }}</footer>
</body>
</html>
